server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (TLS terminates at the reverse proxy in staging/demo)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API and health go to the backend container; the browser only sees this origin.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # media uploads are capped at 10 MB by the API
    }
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
