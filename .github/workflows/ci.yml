name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly to an empty database
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Human-first rule - app starts with no AI/WhatsApp configuration
        run: python -c "import main; print('ok')"
        env:
          DATABASE_URL: sqlite:///./ci.db
      - run: python -m pytest -q
        env:
          APP_ENV: test
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt --strict || true

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
